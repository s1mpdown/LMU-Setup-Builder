name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Restore binary assets
        shell: bash
        run: |
          cat assets/plugin.dll.b64.part* | base64 -d > assets/rFactor2SharedMemoryMapPlugin64.dll
          base64 -d app.ico.b64 > app.ico

      - name: Generate resources (icon + manifest)
        shell: bash
        run: go run github.com/akavel/rsrc@latest -ico app.ico -manifest app.manifest -o rsrc.syso

      - name: Read version
        id: v
        shell: bash
        run: echo "ver=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.ver }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.rel.outputs.exists == 'false'
        shell: bash
        run: go test ./...

      - name: Build
        if: steps.rel.outputs.exists == 'false'
        shell: bash
        run: |
          mkdir -p dist
          go build -ldflags "-H windowsgui -X main.AppVersion=${{ steps.v.outputs.ver }}" -o dist/LMU-Setup-Builder.exe .

      - name: Publish release
        if: steps.rel.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.ver }}" dist/LMU-Setup-Builder.exe --title "LMU Setup Builder v${{ steps.v.outputs.ver }}" --notes "Download LMU-Setup-Builder.exe and run it - or use the UPDATE button inside the app."
